[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pancreatic-decision-agent"
version = "0.2.0"
description = "Audited offline state machine for pancreatic surgical decision research"
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "jsonschema>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
cohort = [
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "pyarrow>=11,<24",
  "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
include = ["pancreatic_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
